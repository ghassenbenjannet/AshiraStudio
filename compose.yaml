services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: achirah
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres_dev_local_only}"
    volumes:
      - achirah_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d achirah"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    image: achirah-hq:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # CDC v4, Lot 3.1/3.3 — `achirah_app` (RLS) pour le serveur, la connexion admin (`postgres`,
      # DDL) pour les migrations/politiques RLS exécutées avant lui (voir Dockerfile CMD).
      DATABASE_URL: "postgres://achirah_app:${POSTGRES_APP_PASSWORD:-achirah_dev_local_only}@db:5432/achirah"
      DATABASE_URL_ADMIN: "postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_local_only}@db:5432/achirah"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:-achirah_dev_local_only}"
      UPLOADS_DIR: /app/uploads
      BACKUPS_DIR: /app/backups
      # CDC v4, Lot 2.2 — optionnelle : générée automatiquement au premier démarrage si absente
      # (jamais requise à la main, jamais bloquante — voir server/src/lib/encryption-key.ts).
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      BUDGET_TOKENS_JOUR: "${BUDGET_TOKENS_JOUR:-2000000}"
    volumes:
      - achirah_data:/app/data
      - achirah_uploads:/app/uploads
      - achirah_backups:/app/backups

volumes:
  achirah_pgdata:
  achirah_data:
  achirah_uploads:
  achirah_backups:
